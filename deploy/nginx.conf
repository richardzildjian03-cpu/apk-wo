// ============================================================
// Contoh konfigurasi Nginx untuk DekorLamaran di VPS.
// Simpan sebagai: /etc/nginx/sites-available/dekorlamaran
// Lalu: ln -s /etc/nginx/sites-available/dekorlamaran /etc/nginx/sites-enabled/
//
// Ganti "wo.domainanda.com" dengan domain Anda.
// Setelah ini jalankan certbot agar dapat HTTPS (wajib untuk kamera HP):
//   sudo certbot --nginx -d wo.domainanda.com
// ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name wo.domainanda.com;

    # Batas ukuran upload (aplikasi ini menerima upload foto paket).
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Dukung WebSocket / streaming (dipakai dev & refresh internal).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # Cache aset statis Next.js agar tidak lag.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
